[project]
name = "lastro"
version = "0.3.0"
description = "Lastro: mentor financeiro self-hosted, com motor determinístico e agentes em qualquer provedor de IA."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Executável oficial do Claude Code (embutido no wheel; termos comerciais da Anthropic). Opcional.
claude-code = ["claude-agent-sdk>=0.2.165"]
# Navegador de pesquisa em fontes oficiais (Chrome headless via Playwright). Opcional.
browser = ["playwright>=1.63.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
]

[tool.uv]
package = false
# Cadeia de suprimentos: só aceita versões publicadas há pelo menos ~2 semanas.
# Atualize esta data conscientemente, após revisar changelogs.
exclude-newer = "2026-10-12T00:00:00Z"
# Exceções da janela por correção de segurança (DECISIONS.md): só o pacote afetado, só até a versão corrigida.
exclude-newer-package = { certifi = "2026-10-20T00:00:00Z" }  # PYSEC-2026-4320, corrigido em 2026.10.18

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--import-mode=importlib"
