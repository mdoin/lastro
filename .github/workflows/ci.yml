name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Todo commit do pull request tem Signed-off-by do próprio autor (DCO 1.1)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <${email}>$"; then
              echo "::error::commit $sha sem 'Signed-off-by: Nome <${email}>' (use git commit -s; ver CONTRIBUTING.md)"
              missing=1
            fi
          done
          exit $missing

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      - run: uv sync --frozen --extra claude-code
      - name: Testes (unidade, integração, segurança; socket Unix e login por terminal virtual incluídos)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gera .env de teste e valida o compose
        run: |
          sh scripts/init-env.sh
          docker compose config --quiet
          docker compose --profile https config --quiet
      - name: Constrói a imagem (sem executáveis opcionais)
        run: docker compose build web
      - name: "Instalação limpa — sobe, espera ficar saudável e confere a API"
        run: |
          set -x
          docker compose up -d web mentor agent-api collector
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' lastro-web-1)" = healthy ]; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/auth/state | grep -q '"setup_required":true'
          docker compose exec -T web test -f /data/setup-token
          docker compose exec -T mentor sh -c '! grep -q " /data " /proc/self/mounts'   # o volume do banco não está no worker
          docker compose exec -T web python -m app.admin backup /data/backups/ci.db
      - if: always()
        run: docker compose logs --no-color | tail -n 200
      - if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Segredos no histórico completo (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact -v

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      - name: Vulnerabilidades conhecidas (Python)
        run: |
          uv export --frozen --no-hashes --all-extras --no-dev > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - name: Vulnerabilidades conhecidas (npm, só o que vai para o navegador)
        working-directory: frontend
        run: npm audit --omit=dev
